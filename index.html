<script>
const SUPABASE_URL=window.__SUPABASE_URL;
const SUPABASE_PUBLISHABLE_KEY=window.__SUPABASE_KEY;
const sb=window.__supabaseClient;
const $=id=>document.getElementById(id);
let session=null,profile=null,equipment=[];
let notificationTimer=null,notificationBaseline=null;
const NOTIFY_KEY='maint_last_notification_state';
const NOTIFY_LIST_KEY='maint_notifications';
let appNotifications=[];
function loadLocalNotifications(){
  try{
    appNotifications=JSON.parse(localStorage.getItem(NOTIFY_LIST_KEY)||'[]');
    if(!Array.isArray(appNotifications)) appNotifications=[];
  }catch(e){appNotifications=[]}
  renderNotificationCenter();
}
function saveLocalNotifications(){
  appNotifications=appNotifications.slice(0,30);
  localStorage.setItem(NOTIFY_LIST_KEY,JSON.stringify(appNotifications));
  renderNotificationCenter();
}
function renderNotificationCenter(){
  const list=$('notificationList'),badge=$('notifyBadge');
  if(!list||!badge)return;
  const unread=appNotifications.filter(x=>!x.read).length;
  badge.textContent=String(unread);
  badge.classList.toggle('hidden',unread===0);
  if(!appNotifications.length){
    list.innerHTML='<div class="empty">Nenhuma notificação.</div>';
    return;
  }
  list.innerHTML=appNotifications.map((n,i)=>`
    <div class="notificationitem ${n.read?'':'unread'}" data-notification-index="${i}">
      <strong>${escapeHtml(n.title)}</strong>
      <div class="small">${escapeHtml(n.body)}</div>
      <div class="small" style="margin-top:5px">${escapeHtml(n.time||'')}</div>
    </div>`).join('');
}
function addAppNotification(title,body,callId){
  appNotifications.unshift({
    id:crypto?.randomUUID?crypto.randomUUID():String(Date.now()),
    callId:callId||'',
    title,body,time:new Date().toLocaleString('pt-BR'),read:false
  });
  saveLocalNotifications();
}
let notificationAudioCtx=null;
async function unlockNotificationAudio(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return false;
    if(!notificationAudioCtx) notificationAudioCtx=new Ctx();
    if(notificationAudioCtx.state==='suspended') await notificationAudioCtx.resume();
    return notificationAudioCtx.state==='running';
  }catch(e){console.warn('Áudio não pôde ser liberado',e);return false}
}
async function playNotificationSound(){
  try{
    const ok=await unlockNotificationAudio();
    if(!ok)return;
    const ctx=notificationAudioCtx;
    const now=ctx.currentTime;
    [880,660,880].forEach((freq,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain(),t=now+i*.18;
      o.type='sine';o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.12,t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+.14);
      o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.15);
    });
  }catch(e){console.warn('Erro no aviso sonoro',e)}
}
async function enableNotifications(){
  if(!('Notification' in window)) return alert('Este navegador não oferece notificações.');
  const p=await Notification.requestPermission();
  if(p==='granted'){
    $('notifyBtn').firstChild.textContent='🔔';
    alert('Notificações ativadas. Enquanto o sistema estiver aberto, as atualizações serão verificadas automaticamente. A base PWA já está preparada; o Push com o sistema fechado será lig[...]
  }else if(p==='denied'){
    alert('As notificações foram bloqueadas. Ative-as nas configurações do navegador.');
  }
}
function notifyUser(title,body,tag){
  addAppNotification(title,body,tag);
  playNotificationSound();
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  try{
    const n=new Notification(title,{body,tag,icon:'icon-192-v10.png',badge:'icon-192-v10.png'});
    n.onclick=()=>{window.focus();n.close();openNotificationByCall(tag)};
  }catch(e){console.warn(e)}
}
const PUSH_VAPID_PUBLIC_KEY='BKfYgrsMLANgE6-ZJ1_SCefdcP33IsBx-5NZGTW3iswSkrCULKr7Qbj0XrKSOqeuVHN0Xp_HfqpdX-qBRmF-fRI';
function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out;
}
async function registerPushOnDevice(){
  const btn=$('enablePushBtn');
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){
      throw new Error('Este navegador não oferece Push. Instale o sistema como aplicativo no Android e tente novamente.');
    }
    const permission=await Notification.requestPermission();
    if(permission!=='granted') throw new Error('Permissão de notificações não concedida.');
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(PUSH_VAPID_PUBLIC_KEY)});
    const j=sub.toJSON();
    const endpoint=j.endpoint, p256dh=j.keys?.p256dh, auth=j.keys?.auth;
    if(!endpoint||!p256dh||!auth) throw new Error('O navegador não retornou os dados da assinatura.');
    const r=await sb.from('push_subscriptions').upsert({user_id:session.user.id,endpoint,p256dh,auth},{onConflict:'endpoint'});
    if(r.error)throw r.error;
    if(btn){btn.textContent='✅ Notificações do aparelho ativadas';btn.disabled=true;}
    alert('Notificações ativadas neste aparelho. O mecânico poderá receber novos chamados mesmo fora da tela do sistema.');
  }catch(e){
    if(btn)btn.disabled=false;
    alert('Não foi possível ativar as notificações: '+(e?.message||e));
  }
}
function openNotificationByCall(callId){
  const item=appNotifications.find(x=>x.callId===callId);
  if(item)item.read=true;
  saveLocalNotifications();
  if(callId && typeof details==='function') details(callId);
}
async function checkNotifications(){
  if(!session||!profile) return;

  const [wr,pr] = await Promise.all([
    sb.from('work_orders')
      .select('id,title,status,priority,created_at,started_at,completed_at,mechanic_id,sector_id')
      .order('created_at',{ascending:false}).limit(50),
    sb.from('part_requests')
      .select('id,work_order_id,part_name,quantity,status,requested_by,created_at')
      .order('created_at',{ascending:false}).limit(50)
  ]);
  if(wr.error) return;

  const rows=wr.data||[];
  const parts=pr.error?[]:(pr.data||[]);

  const currentState=rows.map(x=>[
    x.id,x.status,x.priority,x.started_at,x.completed_at,x.mechanic_id||''
  ].join('|')).join(';;');

  if(notificationBaseline===null){
    notificationBaseline=currentState;
    localStorage.setItem(NOTIFY_KEY,currentState);
    return;
  }

  if(currentState===notificationBaseline){
    // Mesmo sem mudança de chamado, novas solicitações de peça podem gerar aviso ao administrador.
    if(profile.role==='admin'){
      const seenParts=new Set(
        (JSON.parse(localStorage.getItem('maint_seen_parts')||'[]')||[])
      );
      const freshParts=parts.filter(p=>!seenParts.has(p.id) && p.status==='requested');
      if(freshParts.length){
        freshParts.slice(0,8).forEach(p=>{
          notifyUser(
            '📦 Solicitação de peça',
            `${p.part_name} · quantidade ${p.quantity}`,
            p.work_order_id
          );
        });
        localStorage.setItem(
          'maint_seen_parts',
          JSON.stringify(parts.map(p=>p.id).slice(0,80))
        );
      }
    }
    return;
  }

  const previous=notificationBaseline;
  const oldMap=new Map(
    previous.split(';;').filter(Boolean).map(s=>{
      const a=s.split('|');
      return [a[0],{status:a[1],priority:a[2],started_at:a[3],completed_at:a[4],mechanic_id:a[5]||''}];
    })
  );

  const changed=rows.filter(x=>{
    const old=oldMap.get(x.id);
    if(!old) return true;
    return old.status!==x.status ||
           old.priority!==x.priority ||
           old.started_at!==x.started_at ||
           old.completed_at!==x.completed_at ||
           old.mechanic_id!==(x.mechanic_id||'');
  });

  notificationBaseline=currentState;
  localStorage.setItem(NOTIFY_KEY,currentState);

  for(const x of changed.slice(0,10)){
    const old=oldMap.get(x.id);
    const isNew=!old;
    const oldStatus=old?.status||'';
    const newStatus=x.status;

    // SETOR: somente atualizações relevantes do próprio setor.
    if(profile.role==='sector' && x.sector_id===profile.sector_id){
      // Não avisar o próprio setor sobre a abertura do chamado.
      if(isNew && newStatus==='open') continue;

      let title='🔔 Chamado atualizado';
      if(newStatus==='accepted') title='🔧 Chamado aceito';
      else if(newStatus==='in_progress') title='🛠️ Atendimento iniciado';
      else if(newStatus==='waiting_parts') title='�� Aguardando peça';
      else if(oldStatus==='waiting_parts' && newStatus==='in_progress') title='▶️ Atendimento retomado';
      else if(newStatus==='completed') title='🟢 Chamado concluído';
      else if(newStatus==='cancelled') title='⚪ Chamado cancelado';

      notifyUser(
        title,
        `${x.title||'Chamado'} · ${labels[newStatus]||newStatus}`,
        x.id
      );
    }

    // MECÂNICO: novos chamados + alterações dos chamados atribuídos a ele.
    if(profile.role==='mechanic'){
      if(isNew && newStatus==='open'){
        notifyUser(
          x.priority==='urgent'?'🔴 Novo chamado urgente':'🆕 Novo chamado',
          `${x.title||'Chamado'} · ${plabels[x.priority]||x.priority}`,
          x.id
        );
        continue;
      }

      if(x.mechanic_id===session.user.id){
        let title='🔧 Chamado atualizado';
        if(newStatus==='accepted') title='✅ Chamado aceito';
        else if(newStatus==='in_progress') title='🛠️ Atendimento iniciado';
        else if(newStatus==='waiting_parts') title='📦 Aguardando peça';
        else if(oldStatus==='waiting_parts' && newStatus==='in_progress') title='▶️ Peça recebida / atendimento retomado';
        else if(newStatus==='completed') title='🟢 Chamado concluído';

        notifyUser(
          title,
          `${x.title||'Chamado'} · ${labels[newStatus]||newStatus}`,
          x.id
        );
      }
    }

    // ADMINISTRADOR: acompanha eventos relevantes de toda a organização.
    if(profile.role==='admin'){
      let title='🔔 Atualização de chamado';
      if(isNew && newStatus==='open') title=x.priority==='urgent'?'🔴 Novo chamado urgente':'🆕 Novo chamado';
      else if(newStatus==='accepted') title='🔧 Chamado aceito';
      else if(newStatus==='in_progress') title='🛠️ Atendimento iniciado';
      else if(newStatus==='waiting_parts') title='📦 Chamado aguardando peça';
      else if(oldStatus==='waiting_parts' && newStatus==='in_progress') title='▶️ Atendimento retomado';
      else if(newStatus==='completed') title='🟢 Chamado concluído';
      else if(newStatus==='cancelled') title='⚪ Chamado cancelado';

      notifyUser(
        title,
        `${x.title||'Chamado'} · ${labels[newStatus]||newStatus}`,
        x.id
      );
    }
  }

  // Solicitações de peças: administrador é avisado; mecânico não recebe aviso
  // da própria solicitação, evitando duplicidade.
  if(profile.role==='admin'){
    const seenParts=new Set(
      (JSON.parse(localStorage.getItem('maint_seen_parts')||'[]')||[])
    );
    const freshParts=parts.filter(p=>!seenParts.has(p.id) && p.status==='requested');
    freshParts.slice(0,8).forEach(p=>{
      notifyUser(
        '📦 Solicitação de peça',
        `${p.part_name} · quantidade ${p.quantity}`,
        p.work_order_id
      );
    });
    localStorage.setItem(
      'maint_seen_parts',
      JSON.stringify(parts.map(p=>p.id).slice(0,80))
    );
  }

  await loadTickets();
}

function startNotificationPolling(){
  clearInterval(notificationTimer);
  checkNotifications();
  notificationTimer=setInterval(checkNotifications,30000);
}

const labels={open:'Aberto',accepted:'Aceito',in_progress:'Em atendimento',waiting_parts:'Aguardando peça',completed:'Concluído',cancelled:'Cancelado'};
const plabels={urgent:'Urgente',high:'Alta',normal:'Normal',low:'Baixa'};
function notice(el,t,ok=false){el.textContent=t;el.className='notice '+(ok?'ok':'error');el.classList.remove('hidden')}
function fmt(d){return d?new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):''}
function escapeHtml(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function theme(){const t=localStorage.getItem('maint_theme')||'dark';document.documentElement.classList.toggle('light',t==='light');$('themeBtn').textContent=t==='light'?'🌙':'☀️'}
document.addEventListener('pointerdown',()=>{unlockNotificationAudio()},{once:true});
$('notifyBtn').onclick=()=>{
  if($('notifyPanel').classList.contains('hidden')) $('notifyPanel').classList.remove('hidden');
  else $('notifyPanel').classList.add('hidden');
};
$('enablePushBtn').onclick=registerPushOnDevice;
$('markNotificationsRead').onclick=(ev)=>{
  ev.stopPropagation();
  appNotifications.forEach(x=>x.read=true);
  saveLocalNotifications();
};
document.addEventListener('click',function(ev){
  const item=ev.target.closest('.notificationitem');
  if(item){

async function renderAdminHistory(){
  if(profile?.role!=='admin')return;
  const list=$('historyList'); if(!list)return; list.innerHTML='<div class="empty">Carregando histórico...</div>';
  let q=sb.from('maintenance_reports').select('id,work_order_id,equipment_id,diagnosis,work_performed,parts_used,created_at').eq('organization_id',profile.organization_id).order('created_at',{asc[...]
  const eq=$('historyEquipment')?.value,start=$('historyStart')?.value,end=$('historyEnd')?.value,type=$('historyType')?.value;
  if(eq)q=q.eq('equipment_id',eq);
  if(start)q=q.gte('created_at',start+'T00:00:00');
  if(end)q=q.lte('created_at',end+'T23:59:59');
  const r=await q;if(r.error){list.innerHTML='<div class="empty">'+escapeHtml(r.error.message)+'</div>';return}

  let titles={}; if(ids.length){const wr=await sb.from('work_orders').select('id,title').in('id',ids);titles=Object.fromEntries((wr.data||[]).map(x=>[x.id,x.title]))}
  const filtered=rows.filter(x=>!type||(type==='diagnosis'?x.diagnosis:type==='work'?x.work_performed:x.parts_used));
  list.innerHTML=filtered.map(x=>`<div class="historyrow"><h3>${escapeHtml(titles[x.work_order_id]||'Manutenção')}</h3><div class="historymeta"><span>${fmt(x.created_at)}</span></div><div class[...]
}
