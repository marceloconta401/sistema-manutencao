<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Entrar — Sistema de Manutenção</title>
<style>
body{margin:0;background:#0b1220;color:#f8fafc;font-family:Arial,sans-serif;padding:20px}
.box{max-width:460px;margin:8vh auto;background:#111a2b;border:1px solid #26344d;border-radius:18px;padding:24px}
h1{font-size:30px}.field{margin:16px 0}label{display:block;font-weight:bold;margin-bottom:8px}input{width:100%;box-sizing:border-box;background:#172238;color:white;border:1px solid #26344d;border-radius:12px;padding:16px;font-size:18px}button{width:100%;border:0;border-radius:12px;padding:16px;background:#2563eb;color:white;font-weight:bold;font-size:18px;margin-top:8px}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#172554;color:#bfdbfe}.err{background:#450a0a;color:#fecaca}
</style>
</head>
<body>
<div class="box">
<h1>🔐 Acesso ao sistema</h1>
<p>Entre com seu usuário do Supabase.</p>
<div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" placeholder="seu e-mail"></div>
<div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" placeholder="Sua senha"></div>
<button id="btn">Entrar</button>
<div id="msg" class="msg">Digite seus dados e toque em Entrar.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://aijkbluzpmffmnflhjyv.supabase.co';
const KEY='sb_publishable_7E3aFPi5oZgyJ3WxckI9xA_qtHKJjdw';
const msg=document.getElementById('msg'),btn=document.getElementById('btn');
function show(t,e){msg.textContent=t;msg.className='msg'+(e?' err':'')}
btn.onclick=async()=>{
 const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
 if(!email||!password)return show('Digite o e-mail e a senha.',true);
 btn.disabled=true;btn.textContent='Entrando...';show('Conectando...');
 try{
  if(!window.supabase)throw new Error('Biblioteca de acesso não carregou. Verifique a internet e tente novamente.');
  const sb=window.supabase.createClient(SUPABASE_URL,KEY);
  const r=await sb.auth.signInWithPassword({email,password});
  if(r.error)throw r.error;
  if(!r.data||!r.data.session)throw new Error('Login aceito, mas a sessão não foi criada.');
  show('Login realizado! Abrindo o sistema...');
  location.replace('./index.html?v='+Date.now());
 }catch(e){show('Erro no login: '+(e&&e.message?e.message:String(e)),true)}
 finally{btn.disabled=false;btn.textContent='Entrar'}
};
</script>
</body>
</html>
