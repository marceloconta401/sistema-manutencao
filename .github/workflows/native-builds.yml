name: Build Sistema de Manutenção
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: all
        options: [all, android, windows]
        description: Plataforma para compilar
jobs:
  windows:
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/manutencao-android run windows:exe
      - uses: actions/upload-artifact@v4
        with:
          name: Sistema-de-Manutencao-Windows
          path: artifacts/manutencao-android/release/*.exe
          if-no-files-found: error
  android:
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - name: Configure Firebase Android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          node -e 'const fs=require("fs");const value=process.env.GOOGLE_SERVICES_JSON_BASE64;if(!value)throw new Error("Configure GOOGLE_SERVICES_JSON_BASE64 in GitHub Actions secrets");const data=Buffer.from(value,"base64");JSON.parse(data);fs.writeFileSync("artifacts/manutencao-android/android/app/google-services.json",data);'
      - run: pnpm --filter @workspace/manutencao-android run android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sistema-de-Manutencao-Android-debug
          path: artifacts/manutencao-android/release/*.apk
          if-no-files-found: error
